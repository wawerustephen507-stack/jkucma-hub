<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jkucma-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JKUCMA Hub" />
    <link rel="apple-touch-icon" href="/jkucma-logo.png" />

    <meta name="theme-color" content="#003366" />

    <title>JKUCMA Digital Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker Configured Successfully:', reg.scope))
            .catch(err => console.error('PWA Initialization Failed:', err));
        });
      }
    </script>
  </body>
</html>
